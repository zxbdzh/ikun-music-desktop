name: AurioClub Contract Verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurio-contract-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifier-unit:
    name: Contract verifier unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test contract verifier
        run: node --test scripts/apifox/aurio-contract-verifier.test.mjs
