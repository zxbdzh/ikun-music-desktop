name: AurioClub Contract Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aurio-contract-regression.yml'
      - '.github/workflows/aurio-contract-verifier.yml'
      - 'docs/apifox/8689463/**'
      - 'scripts/apifox/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: aurio-contract-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-regression:
    name: Isolated Apifox suite
    if: github.ref == 'refs/heads/main'
    environment: aurio-contract-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Apifox CLI
        run: npm install --global apifox-cli@2.2.9

      - name: Test contract verifier
        run: node --test scripts/apifox/aurio-contract-verifier.test.mjs

      - name: Verify Apifox access token
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
        run: test -n "$APIFOX_ACCESS_TOKEN" || { echo '::error::Missing APIFOX_ACCESS_TOKEN Environment Secret in protected environment aurio-contract-regression'; exit 1; }

      - name: Run isolated contract suite
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
        run: exec node scripts/apifox/run-aurio-contract-regression.mjs --upload-report
